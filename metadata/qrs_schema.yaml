# IonSense-QKG quantum-readiness metadata schema
# QRS is a metadata-driven feasibility heuristic, not an empirical
# quantum-advantage or model-performance metric.

version: 0.2
score_name: Quantum Readiness Score
score_abbreviation: QRS
score_interpretation: NISQ workflow readiness for future hybrid quantum-classical benchmarking

component_scale:
  high: 1.0
  medium: 0.5
  low: 0.0

components:
  feature_compactness:
    symbol: F
    weight: 0.25
    description: Compactness of input features and estimated qubit feasibility.
  sequence_suitability:
    symbol: S
    weight: 0.20
    description: Suitability for short-window, curve, spectral, or summary encoding.
  modality_compatibility:
    symbol: M
    weight: 0.20
    description: Compatibility of the signal modality with quantum feature maps or hybrid encodings.
  label_availability:
    symbol: L
    weight: 0.15
    description: Availability and clarity of supervised or evaluation labels.
  preprocessing_burden:
    symbol: P
    weight: 0.15
    paper_label: preprocessing_feasibility
    description: Ease of producing quantum-ready inputs; high means low preprocessing burden.
  access_reproducibility:
    symbol: A
    weight: 0.05
    description: Public access, documentation, citation readiness, and reproducibility.

primary_formula: "QRS(D)=0.25F(D)+0.20S(D)+0.20M(D)+0.15L(D)+0.15P(D)+0.05A(D)"

robustness_outputs:
  - qrs_cross_method_agreement.csv
  - qrs_sensitivity_grid.csv
  - qrs_robustness_report.txt

notes:
  - QRS supports first-pass candidate selection and dataset triage.
  - A high QRS does not imply quantum advantage or higher downstream accuracy.
  - Low-QRS datasets may still be scientifically important but require heavier classical preprocessing or embeddings.
